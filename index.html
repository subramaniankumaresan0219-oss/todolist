<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Todo List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>Todo List</h1>
      <form id="task-form" aria-label="Add todo">
        <input id="task-input" type="text" placeholder="Add a new task..." aria-label="Task description" />
        <button type="submit" id="add-btn">Add</button>
      </form>
    </header>

    <section class="controls">
      <div class="filters" role="tablist" aria-label="Filter tasks">
        <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
      </div>
      <div class="actions">
        <button id="clear-completed">Clear completed</button>
        <div id="count" aria-live="polite">0 items left</div>
      </div>
    </section>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>

    <footer class="attribution">
      <small>Built with HTML, CSS, and JavaScript — persistent via localStorage</small>
    </footer>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
